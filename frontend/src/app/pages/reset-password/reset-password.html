<div class="login-wrapper">
  <div class="card login-card">
    <div class="card-block">
      <div class="card-title">{{ 'resetPassword.title' | translate }}</div>
      <div class="card-text">
        <form (ngSubmit)="onSubmit()" *ngIf="!success">
          <div class="clr-form-control">
            <label for="newPassword" class="clr-control-label">{{ 'resetPassword.newPassword' | translate }}</label>
            <div class="clr-control-container">
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                class="clr-input"
                [(ngModel)]="newPassword"
                autocomplete="new-password"
              />
            </div>
          </div>

          <div class="clr-form-control">
            <label for="confirmPassword" class="clr-control-label">{{ 'resetPassword.confirmPassword' | translate }}</label>
            <div class="clr-control-container">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                class="clr-input"
                [(ngModel)]="confirmPassword"
                autocomplete="new-password"
              />
            </div>
          </div>

          <div class="alert alert-danger" role="alert" *ngIf="message && isError">
            <div class="alert-items">
              <div class="alert-item static">
                <span class="alert-text">{{ message }}</span>
              </div>
            </div>
          </div>
        </form>

        <div class="alert alert-success" role="alert" *ngIf="success">
          <div class="alert-items">
            <div class="alert-item static">
              <span class="alert-text">{{ message }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" [disabled]="isLoading" (click)="onSubmit()" *ngIf="!success">
        {{ (isLoading ? 'common.saving' : 'resetPassword.resetPassword') | translate }}
      </button>
      <button class="btn btn-primary" (click)="goToLogin()" *ngIf="success">
        {{ 'resetPassword.goToLogin' | translate }}
      </button>
    </div>
  </div>
</div>
