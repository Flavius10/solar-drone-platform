<div class="login-wrapper">
  <div class="card login-card">
    <div class="card-block">
      <div class="card-title">{{ 'forgotPassword.title' | translate }}</div>
      <div class="card-text">
        <form (ngSubmit)="onSubmit()" *ngIf="!submitted">
          <p>{{ 'forgotPassword.instructions' | translate }}</p>
          <div class="clr-form-control">
            <label for="username" class="clr-control-label">{{ 'common.username' | translate }}</label>
            <div class="clr-control-container">
              <input
                type="text"
                id="username"
                name="username"
                class="clr-input"
                [(ngModel)]="username"
                autocomplete="username"
              />
            </div>
          </div>
        </form>

        <div class="alert alert-info" role="alert" *ngIf="submitted">
          <div class="alert-items">
            <div class="alert-item static">
              <span class="alert-text">{{ message }}</span>
            </div>
          </div>
        </div>

        <div class="alert alert-danger" role="alert" *ngIf="message && !submitted">
          <div class="alert-items">
            <div class="alert-item static">
              <span class="alert-text">{{ message }}</span>
            </div>
          </div>
        </div>

        <a routerLink="/login" class="forgot-password-link">{{ 'forgotPassword.backToLogin' | translate }}</a>
      </div>
    </div>
    <div class="card-footer" *ngIf="!submitted">
      <button class="btn btn-primary" [disabled]="isLoading" (click)="onSubmit()">
        {{ (isLoading ? 'forgotPassword.sending' : 'forgotPassword.sendResetLink') | translate }}
      </button>
    </div>
  </div>
</div>
